<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Yantra Nova</title>
    <style>
        :root {
            --bg-base: #fcf8f5;
            --peach-soft: #f9efe8;
            --cream: #f4eae1;
            --warm-glow: rgba(235, 185, 155, 0.25);
            --orange-tint: rgba(220, 120, 80, 0.08);
            --text-color: #3d3430;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg-base);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .intro-viewport {
            position: relative;
            width: 100vw;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 50%, var(--peach-soft) 0%, var(--bg-base) 70%);
            opacity: 0;
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .intro-viewport.active {
            opacity: 1;
        }

        .intro-viewport.fade-out {
            opacity: 0;
            transform: scale(1.03);
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .ambient-glow {
            position: absolute;
            width: 60vmax;
            height: 60vmax;
            background: radial-gradient(circle, var(--warm-glow) 0%, var(--orange-tint) 50%, transparent 70%);
            border-radius: 50%;
            filter: blur(40px);
            pointer-events: none;
            transform: scale(0.6);
            opacity: 0;
            animation: pulseGlow 5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .brand-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.78) translateY(12px);
            filter: blur(12px);
            animation: revealBrand 2.2s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
            width: 75vw;
            max-width: 360px;
        }

        .logo-container {
            position: relative;
            width: 55vw;
            max-width: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .logo-container img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            filter: drop-shadow(0 15px 35px rgba(180, 110, 80, 0.12));
        }

        .brand-title {
            font-size: clamp(1.4rem, 4vw, 2rem);
            font-weight: 600;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--text-color);
            text-align: center;
            margin-top: 4px;
            opacity: 0;
            transform: translateY(8px);
            animation: revealText 1.4s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
        }

        .light-sweep {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                135deg,
                transparent 40%,
                rgba(255, 255, 255, 0.4) 50%,
                transparent 60%
            );
            transform: rotate(25deg) translateY(-100%);
            pointer-events: none;
            animation: sweepLight 1.8s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
        }

        @keyframes pulseGlow {
            0% {
                transform: scale(0.6);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }

        @keyframes revealBrand {
            0% {
                opacity: 0;
                transform: scale(0.78) translateY(12px);
                filter: blur(12px);
            }
            60% {
                opacity: 1;
                filter: blur(0px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0px);
            }
        }

        @keyframes revealText {
            0% {
                opacity: 0;
                transform: translateY(8px);
            }
            100% {
                opacity: 0.9;
                transform: translateY(0);
            }
        }

        @keyframes sweepLight {
            0% {
                transform: rotate(25deg) translateY(-100%);
            }
            100% {
                transform: rotate(25deg) translateY(100%);
            }
        }

        @media (min-width: 768px) {
            .brand-wrapper {
                max-width: 420px;
            }
            .logo-container {
                width: 190px;
            }
        }
    </style>
</head>
<body>

    <div class="intro-viewport" id="viewport">
        <div class="ambient-glow"></div>
        <canvas id="stage"></canvas>
        <div class="brand-wrapper">
            <div class="light-sweep"></div>
            <div class="logo-container">
                <img src="https://i.postimg.cc/9QzVmqpm/1788760114199.png" alt="Yantra Nova Logo">
            </div>
            <h1 class="brand-title">Yantra Nova</h1>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const viewport = document.getElementById('viewport');
            const canvas = document.getElementById('stage');
            const ctx = canvas.getContext('2d');

            let width, height;
            let particles = [];
            let animationFrameId;
            let startTime = null;
            const duration = 5000;

            function resize() {
                width = canvas.width = window.innerWidth * window.devicePixelRatio;
                height = canvas.height = window.innerHeight * window.devicePixelRatio;
                ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            }

            window.addEventListener('resize', resize);
            resize();

            class Particle {
                constructor() {
                    this.reset();
                }

                reset() {
                    const angle = Math.random() * Math.PI * 2;
                    const distance = Math.max(window.innerWidth, window.innerHeight) * (0.4 + Math.random() * 0.3);
                    
                    this.x = window.innerWidth / 2 + Math.cos(angle) * distance;
                    this.y = window.innerHeight / 2 + Math.sin(angle) * distance;
                    
                    this.targetX = window.innerWidth / 2 + (Math.random() - 0.5) * window.innerWidth * 0.5;
                    this.targetY = window.innerHeight / 2 + (Math.random() - 0.5) * window.innerHeight * 0.5;
                    
                    this.vx = (this.targetX - this.x) / (60 + Math.random() * 40);
                    this.vy = (this.targetY - this.y) / (60 + Math.random() * 40);
                    
                    this.radius = Math.random() * 1.5 + 0.5;
                    this.alpha = 0;
                    this.maxAlpha = Math.random() * 0.4 + 0.1;
                }

                update(progress) {
                    this.x += this.vx * 0.8;
                    this.y += this.vy * 0.8;

                    if (progress < 0.3) {
                        this.alpha = Math.min(this.maxAlpha, this.alpha + 0.02);
                    } else if (progress > 0.8) {
                        this.alpha = Math.max(0, this.alpha - 0.03);
                    }
                }

                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(210, 130, 95, ${this.alpha})`;
                    ctx.fill();
                }
            }

            function initParticles() {
                particles = [];
                const count = window.innerWidth < 768 ? 35 : 60;
                for (let i = 0; i < count; i++) {
                    particles.push(new Particle());
                }
            }

            initParticles();
            requestAnimationFrame(() => viewport.classList.add('active'));

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                const progress = Math.min(elapsed / duration, 1);

                ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

                particles.forEach((p, index) => {
                    p.update(progress);
                    p.draw();

                    for (let j = index + 1; j < particles.length; j++) {
                        const p2 = particles[j];
                        const dx = p.x - p2.x;
                        const dy = p.y - p2.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < 120) {
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(p2.x, p2.y);
                            const lineAlpha = (1 - dist / 120) * p.alpha * 0.3;
                            ctx.strokeStyle = `rgba(200, 120, 90, ${lineAlpha})`;
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        }
                    }
                });

                if (progress < 1) {
                    animationFrameId = requestAnimationFrame(animate);
                } else {
                    viewport.classList.add('fade-out');
                    setTimeout(() => {
                        window.location.href = "yantranova.html";
                    }, 800);
                }
            }

            animationFrameId = requestAnimationFrame(animate);
        });
    </script>
</body>
</html>
